<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Climate Box</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ── Top bar ───────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <h1>CLIMATE BOX</h1>
    </div>

    <div class="clock">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date">&nbsp;</div>
    </div>

    <div class="topbar-status">
      <span class="stat" id="stat-link"></span>
      <span class="stat stat-temp"><i data-icon="thermometer"></i><b id="top-temp">--.- °C</b></span>
      <span class="stat stat-hum"><i data-icon="droplet"></i><b id="top-hum">-- %</b></span>
    </div>
  </header>

  <!-- ── View container ────────────────────────────────────── -->
  <main id="view"></main>

  <!-- ── Bottom navigation ─────────────────────────────────── -->
  <nav class="navbar" id="navbar">
    <button class="nav-btn is-active" data-route="home"><i data-icon="home"></i><span>HOME</span></button>
    <button class="nav-btn" data-route="scenes"><i data-icon="grid"></i><span>SCENES</span></button>
    <button class="nav-btn" data-route="devices"><i data-icon="cube"></i><span>DEVICES</span></button>
    <button class="nav-btn" data-route="sensors"><i data-icon="activity"></i><span>SENSORS</span></button>
    <button class="nav-btn" data-route="settings"><i data-icon="gear"></i><span>SETTINGS</span></button>
  </nav>

  <div class="footer-note">RASPBERRY PI 5 &nbsp;•&nbsp; TOUCH DISPLAY 2</div>
</div>

<!-- Toast host -->
<div id="toast-host" class="toast-host"></div>

<script>window.CB_BACKEND = 'http';</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
